name: Search Repair and Retest - Diagnose, Bounded Repair, Delayed Retest

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit diagnostics/repair/retest artifacts
        type: boolean
        default: true
  schedule:
    - cron: '40 10 * * *'

permissions:
  contents: write

env:
  CI_AUTONOMOUS_BRANCH: main

concurrency:
  group: wpp-autonomous-writer-main
  cancel-in-progress: false

jobs:
  diagnose_repair_retest:
    timeout-minutes: 14  # ~3x median 3.2m over 8 green runs + ~1.5m for 150 URL inspections at 8 in parallel; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: bash scripts/ci_npm_install.sh
      - id: runtime
        run: node scripts/runtime_guard.mjs
      - name: Sync latest main before writing artifacts
        if: steps.runtime.outputs.allowed == 'true'
        run: git pull --rebase origin "$CI_AUTONOMOUS_BRANCH"
      - name: Validate workflow syntax
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run actions:validate
      # Search Console intelligence (11 Oct 2026): rolling 28-day query x page,
      # URL Inspection over the sitemap 150/day (8 in parallel) with counts by
      # coverageState, and sitemaps.list (submit if missing). Then the measured
      # target set and consolidation list are rebuilt from those rows, which is
      # what the publication freeze gate reads. Without the secret the collector
      # prints a NAMED STOP and leaves the committed files as they are.
      - name: Collect Search Console intelligence
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
          npm run search:intelligence
      - name: Rebuild measured targets and consolidation candidates
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run seo:measured-targets
      - name: Ingest any filled manual query-surface observation log
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run query:observe:ingest
      - name: Diagnose pages (evidence + technical)
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run repairs:diagnose
      - name: Apply bounded AUTO / AUTO_WATCH repairs (thaw, mutate, validate, refreeze)
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run repairs:apply
      - name: Sweep delayed retest queue for real evidence
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run repairs:retest
      - name: Commit search repair and retest artifacts
        if: ${{ steps.runtime.outputs.allowed == 'true' && (github.event_name == 'schedule' || github.event.inputs.commit_changes == 'true') }}
        env:
          PRE_PUSH_VALIDATION_ARGV: npm run release:push-gate
        run: |
          bash .github/scripts/commit_and_push_if_changed.sh \
            "Search repair/retest sweep: diagnose, bounded repair, delayed retest" search-repair-retest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-repair-retest-evidence
          path: |
            data/opportunities/page_diagnostics.json
            data/release/repair_receipts/
            data/release/repair_receipts_index.json
            data/authority_scale/retest_queue.json
            data/authority_scale/retest_outcomes.json
            data/admin/cost_ledger.json
            artifacts/release/apply_repairs_summary.json
            data/search_intelligence/
            data/seo/measured_targets.json
            data/seo/consolidation_candidates.json
          if-no-files-found: ignore
