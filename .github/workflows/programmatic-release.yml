name: Programmatic Content Release - Full Flow 90 Day

on:
  workflow_dispatch:
    inputs:
      max_new_pages:
        description: Max new pages for this run
        type: number
        default: 50
      max_repairs:
        description: Max repairs for this run
        type: number
        default: 100
  schedule:
    - cron: '35 8,20 * * *'

permissions:
  contents: write

env:
  CI_AUTONOMOUS_BRANCH: main
  MAX_NEW_PAGES_PER_DAY: '50'
  MAX_REPAIRS_PER_DAY: '100'

concurrency:
  group: wpp-autonomous-writer-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: bash scripts/ci_npm_install.sh
      - id: runtime
        run: node scripts/runtime_guard.mjs
      - run: python -m pip install --upgrade pip && python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Sync latest main before autonomous release
        if: steps.runtime.outputs.allowed == 'true'
        run: git pull --rebase origin "$CI_AUTONOMOUS_BRANCH"
      - name: Validate workflow syntax
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run actions:validate
      - name: Run GSC primary collector
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SECRET: ${{ secrets.GSC_SITE_URL }}
          GSC_SITE_URL_VAR: ${{ vars.GSC_SITE_URL }}
        run: |
          export GSC_SITE_URL="${GSC_SITE_URL_SECRET:-${GSC_SITE_URL_VAR:-}}"
          python distribution_scripts/gsc_collect_query_signals.py
      - name: Run controlled autonomous content release
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export MAX_NEW_PAGES_PER_DAY="${{ github.event.inputs.max_new_pages }}"
            export MAX_REPAIRS_PER_DAY="${{ github.event.inputs.max_repairs }}"
          fi
          npm run release:autonomous
      - name: Commit generated pages and registries
        if: steps.runtime.outputs.allowed == 'true'
        env:
          PRE_PUSH_VALIDATION_ARGV: npm run release:push-gate
        run: |
          bash .github/scripts/commit_and_push_if_changed.sh \
            "Run controlled programmatic content release" programmatic-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: programmatic-release-evidence
          path: |
            data/releases/
            releases/
            artifacts/release/
            logs/deep-validation/
          if-no-files-found: ignore
