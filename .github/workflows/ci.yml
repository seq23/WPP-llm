name: CI - Build and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Five lanes push to main through commit_and_push_if_changed.sh, authenticated
  # with GITHUB_TOKEN, and GitHub does not trigger workflows on those pushes. So
  # push: alone cannot observe most of what lands on main: on 2026-08-29 the last
  # green run had tested 019b7448 while main was abea8a17d, and `npm run
  # cadence:gate` on that commit exits 1. This runs after the daily writers (the
  # latest is search-repair-retest at 10:40 UTC) so a red main is reported within
  # hours instead of waiting for a human PR to reveal it.
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: read
  # Deleting a workflow file does not delete the workflow. On 2026-06-25 commit
  # 924f9707 removed auto_publish_insights.yml; GitHub kept id 231677534 at
  # state=active, frozen on a failure, and it sat there unread for 71 days
  # because a lane that never runs never goes red. validate:workflow-liveness
  # lists workflows and their runs to catch that; without actions:read it could
  # only ever emit a named stop, which is the silence itself.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: bash scripts/ci_npm_install.sh
      - run: npm run actions:validate
      - run: npm run validate:workflow-data-trace
      - run: npm run validate:workflow-faux-trace
      # Hard-fails if any workflow GitHub reports active has produced no run
      # inside its own declared cron window, or exists on GitHub with no file and
      # no entry in _workflow_liveness_contract.json retired[].
      #
      # GH_TOKEN is not optional here. Runners ship gh unauthenticated and do not
      # put GITHUB_TOKEN in the environment, so without this the check degrades to
      # a named stop and passes green having looked at nothing - the first run of
      # this step did exactly that. The validator hard-fails on a missing token
      # when GITHUB_ACTIONS is set, so this cannot silently regress.
      - run: npm run validate:workflow-liveness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:push-helper
      # Two instruments that reported nothing and were believed. The citation
      # probe published a self-cited rate of 0 from a run where all 11 calls
      # errored; the retest loop recorded zero outcomes for its entire life
      # because it matched field names the signal file has never emitted. Both
      # were green. These tests fail if either can happen again.
      - run: npm run test:citation-probe-rate
      - run: npm run test:retest-loop
      - run: npm run release:self-heal
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        #
        # The integrity check runs first and is not optional: the gate used to
        # rewrite the ledger it reads, so a blocked run cleared itself on the
        # next invocation. A gate that cannot hold a verdict reports a status
        # without enforcing anything, which is worse than having no gate.
        run: |
          npm run validate:cadence-integrity
          npm run cadence:gate
          npm run cadence:template-share
