name: Search Loop

# The shared search growth engine (seq23/search-loop @v1), owner ruling 1 Nov 2026.
# It replaces this repo's own find/build/repair lanes (query-intelligence,
# programmatic-release, search-repair-retest): find easy searches weekly, publish
# one gated page per search daily under /questions/ (published straight away),
# check every page at 2/4/8 weeks and 90 days, strengthen / undo / merge, and
# upload the weekly report artifact "search-loop-week". Every page ends in the
# site's one action: an inquiry with West Peek Productions.
# Throttle every site at once: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: '35 3 * * *'  # America/Chicago, all year (the retired release lane's slot)
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: wpp-autonomous-writer-main
  cancel-in-progress: false

jobs:
  # The admin command centre's pause / emergency stop (data/admin/runtime_control.json)
  # governs this lane as it governed the release lane it replaced: when the state
  # is not ACTIVE the loop job is skipped and this job's log names the state.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - uses: actions/checkout@v6
      - id: guard
        run: node scripts/runtime_guard.mjs

  search-loop:
    needs: runtime
    if: needs.runtime.outputs.allowed == 'true'
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: bash scripts/ci_npm_install.sh
      post_build_command: bash .github/scripts/search_loop_post_build.sh
      commit_command: ./.github/scripts/search_loop_commit.sh
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
