name: Query Intelligence - GSC Gemini and $0 Signals

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit regenerated query intelligence artifacts
        type: boolean
        default: true
  schedule:
    - cron: '10 7,19 * * *'

permissions:
  contents: write

env:
  CI_AUTONOMOUS_BRANCH: main

concurrency:
  group: wpp-autonomous-writer-main
  cancel-in-progress: false

jobs:
  collect_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: bash scripts/ci_npm_install.sh
      - id: runtime
        run: node scripts/runtime_guard.mjs
      - run: python -m pip install --upgrade pip && python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Sync latest main before writing artifacts
        if: steps.runtime.outputs.allowed == 'true'
        run: git pull --rebase origin "$CI_AUTONOMOUS_BRANCH"
      - name: Validate workflow syntax
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run actions:validate
      - name: Generate owned query universe and public atlas
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run query:atlas
      - name: Collect Search Console query signals
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SECRET: ${{ secrets.GSC_SITE_URL }}
          GSC_SITE_URL_VAR: ${{ vars.GSC_SITE_URL }}
        run: |
          export GSC_SITE_URL="${GSC_SITE_URL_SECRET:-${GSC_SITE_URL_VAR:-}}"
          python distribution_scripts/gsc_collect_query_signals.py
      # Measured demand must reach the atlas evidence gate, not just the repair
      # lane. Without this the atlas publishes against six hand-seeded T2b rows.
      # Runs before "Validate query intelligence" so a bad ingest blocks here.
      - name: Ingest measured Search Console queries as T1 atlas evidence
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_SECRET: ${{ secrets.GSC_SITE_URL }}
          GSC_SITE_URL_VAR: ${{ vars.GSC_SITE_URL }}
        run: |
          export GSC_SITE_URL="${GSC_SITE_URL_SECRET:-${GSC_SITE_URL_VAR:-}}"
          npm run queries:ingest
          npm run atlas:build
      - name: Collect normalized $0 signals including optional Gemini prompt panel
        if: steps.runtime.outputs.allowed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run signals:collect
      # The only step that observes whether an answer engine actually cites us.
      # Everything else in this workflow measures demand or our own output. It
      # does not fail the run when the key is absent - a measurement that breaks
      # the build when it cannot measure gets deleted.
      - name: Observe whether answer engines cite us
        if: steps.runtime.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: npm run citation:probe -- --limit 25
      - name: Score AEO and GEO opportunities
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run opportunities:score
      - name: Build controlled release plan preview
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run release:plan
      - name: Validate query intelligence
        if: steps.runtime.outputs.allowed == 'true'
        run: npm run validate:autonomous
      - name: Commit query intelligence artifacts
        if: ${{ steps.runtime.outputs.allowed == 'true' && (github.event_name == 'schedule' || github.event.inputs.commit_changes == 'true') }}
        env:
          PRE_PUSH_VALIDATION_ARGV: npm run release:push-gate
        run: |
          bash .github/scripts/commit_and_push_if_changed.sh \
            'query-intelligence: update governed query atlas' query-intelligence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: query-intelligence-evidence
          path: |
            data/signals/
            data/opportunities/
            data/query_atlas/
            artifacts/release/
          if-no-files-found: ignore
